name: Guided Assistance IPA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source/guided-assistance/**'
      - '.github/workflows/guided-assistance.yml'
  push:
    branches: [main]
    paths:
      - 'source/guided-assistance/**'
      - '.github/workflows/guided-assistance.yml'
permissions:
  contents: write
concurrency:
  group: opaline-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Choose app version
        id: release
        shell: bash
        run: |
          PATCH=0
          while git rev-parse -q --verify "refs/tags/guided-1.0.$PATCH" >/dev/null; do PATCH=$((PATCH+1)); done
          echo "version=1.0.$PATCH" >> "$GITHUB_OUTPUT"
      - name: Core knowledge checks
        working-directory: source/guided-assistance
        run: swift test
      - name: Build installable iPhone IPA
        env:
          GUIDED_VERSION: ${{ steps.release.outputs.version }}
          GUIDED_BUILD: ${{ github.run_number }}
        run: bash source/guided-assistance/build.sh
      - name: Verify native app in iPhone simulator
        env:
          GUIDED_VERSION: ${{ steps.release.outputs.version }}
          GUIDED_BUILD: ${{ github.run_number }}
        run: bash source/guided-assistance/smoke.sh
      - name: Check shared Mac app target
        working-directory: source/guided-assistance
        run: xcodebuild -quiet -project GuidedAssistance.xcodeproj -scheme GuidedAssistance-Mac -configuration Release -destination 'platform=macOS,arch=arm64' -derivedDataPath build/MacDerivedData -clonedSourcePackagesDirPath build/Packages CODE_SIGNING_ALLOWED=NO build
      - name: Publish app and update existing AltStore source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ROOT=source/guided-assistance
          TAG="guided-$VERSION"
          IPA="$ROOT/build/GuidedAssistance.ipa"
          gh release create "$TAG" "$IPA" "$ROOT/build/guided-assistance-icon.png" \
            "$ROOT/build/guided-assistance-screenshot.png" "$ROOT/build/simulator-check.json" \
            --draft --title "Guided Assistance $VERSION" --notes-file "$ROOT/RELEASE.md" --target "$GITHUB_SHA"
          gh release edit "$TAG" --draft=false --latest=false
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/GuidedAssistance.ipa"
          curl --fail --location --head --retry 5 --retry-all-errors --retry-delay 3 "$URL"
          SIZE=$(stat -f%z "$IPA")
          DATE=$(gh release view "$TAG" --json publishedAt --jq .publishedAt)
          git pull --rebase origin main
          python3 scripts/update_source.py --file source/apps.json --app-template "$ROOT/release/app.json" \
            --version "$VERSION" --download-url "$URL" --size "$SIZE" --date "$DATE" --ipa "$IPA" \
            --notes-file "$ROOT/RELEASE.md" --release-title "Guided Assistance $VERSION"
          python3 - "$TAG" <<'PY'
          import json,pathlib,sys,os
          path=pathlib.Path('source/apps.json');data=json.loads(path.read_text())
          app=next(a for a in data['apps'] if a['bundleIdentifier']=='com.kharrison.guidedassistance')
          base=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{sys.argv[1]}"
          app['iconURL']=base+'/guided-assistance-icon.png'
          app['screenshots']=[base+'/guided-assistance-screenshot.png']
          path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/apps.json
          git commit -m "Publish Guided Assistance $VERSION in AltStore [skip ci]"
          git push origin HEAD:main
      - name: Save build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-assistance-${{ github.run_number }}
          path: |
            source/guided-assistance/build/GuidedAssistance.ipa
            source/guided-assistance/build/guided-assistance-icon.png
            source/guided-assistance/build/guided-assistance-screenshot.png
            source/guided-assistance/build/simulator-check.json
            source/guided-assistance/GuidedAssistance.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore

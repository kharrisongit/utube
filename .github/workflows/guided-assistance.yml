name: Guided Assistance IPA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source/guided-assistance/**'
      - '.github/workflows/guided-assistance.yml'
  push:
    branches: [main]
    paths:
      - 'source/guided-assistance/**'
      - '.github/workflows/guided-assistance.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('guided-assistance-{0}', github.ref) || 'opaline-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Clear superseded checks for this app
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          repo=os.environ['GITHUB_REPOSITORY']; current=int(os.environ['GITHUB_RUN_ID'])
          url=f'repos/{repo}/actions/workflows/guided-assistance.yml/runs?event=pull_request&per_page=30'
          result=subprocess.run(['gh','api',url],capture_output=True,text=True)
          pending=[]
          if result.returncode == 0:
              for run in json.loads(result.stdout).get('workflow_runs',[]):
                  if run['id'] < current and run.get('head_branch') == os.environ['HEAD_BRANCH'] and run['status'] in ('queued','in_progress','waiting','pending'):
                      subprocess.run(['gh','api','-X','POST',f"repos/{repo}/actions/runs/{run['id']}/cancel"],check=False)
                      pending.append(run['id'])
          for attempt in range(36):
              pending=[run_id for run_id in pending if json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))['status']!='completed']
              if not pending: break
              time.sleep(5)
          PY
      - name: Core knowledge checks
        working-directory: source/guided-assistance
        run: swift test
  build:
    needs: prepare
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Choose app version
        id: release
        shell: bash
        run: |
          PATCH=0
          while git rev-parse -q --verify "refs/tags/guided-1.0.$PATCH" >/dev/null; do PATCH=$((PATCH+1)); done
          echo "version=1.0.$PATCH" >> "$GITHUB_OUTPUT"
      - name: Reuse a verified IPA with identical app source and build workflow
        id: verified
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shutil,subprocess,tempfile
          repo=os.environ['GITHUB_REPOSITORY']
          def command(*args):
              return subprocess.check_output(args,text=True).strip()
          paths=['source/guided-assistance','.github/workflows/guided-assistance.yml']
          current=[command('git','rev-parse','HEAD:'+path) for path in paths]
          candidates=json.loads(command('gh','api',
              f'repos/{repo}/actions/workflows/guided-assistance.yml/runs?event=pull_request&status=success&per_page=20'))['workflow_runs']
          approved=None
          for run in candidates:
              if run['conclusion']!='success' or run['head_repository']['full_name']!=repo:
                  continue
              subprocess.run(['git','fetch','origin',run['head_sha']],check=True)
              previous=[command('git','rev-parse',run['head_sha']+':'+path) for path in paths]
              if current==previous:
                  approved=run
                  break
          if approved is None:
              print('No verified build matches this source and workflow; compiling from source.')
              raise SystemExit(0)
          with tempfile.TemporaryDirectory(prefix='guided-verified-') as folder:
              subprocess.run(['gh','run','download',str(approved['id']),'--repo',repo,
                  '--name',f"guided-assistance-{approved['run_number']}",'--dir',folder],check=True)
              source=pathlib.Path(folder)/'build'
              report=json.loads((source/'simulator-check.json').read_text())
              assert report.get('status')=='passed' and report.get('checks')==9,report
              checked=subprocess.run(['python3','source/guided-assistance/scripts/check_ipa.py',
                  str(source/'GuidedAssistance.ipa'),os.environ['VERSION'],str(approved['run_number'])])
              if checked.returncode:
                  print('The stored package does not match the requested release; compiling from source.')
                  raise SystemExit(0)
              destination=pathlib.Path('source/guided-assistance/build')
              destination.mkdir(parents=True,exist_ok=True)
              files=['GuidedAssistance.ipa','guided-assistance-icon.png',
                  'guided-assistance-screenshot.png','simulator-check.json']
              for name in files:
                  if name.endswith('.png'):
                      assert (source/name).read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a'))
                  shutil.copy2(source/name,destination/name)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('ready=true\n')
          print(f"Reusing tested IPA from run {approved['id']}: identical app and workflow, valid package, and passing simulator report.")
          PY
      - name: Select Xcode
        if: steps.verified.outputs.ready != 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - uses: actions/cache/restore@v4
        if: steps.verified.outputs.ready != 'true'
        with:
          path: |
            source/guided-assistance/build/Packages
            source/guided-assistance/build/DerivedData
            source/guided-assistance/build/MacDerivedData
          key: guided-native-xcode266-${{ github.run_id }}
          restore-keys: guided-native-xcode266-
      - name: Build installable iPhone IPA
        if: steps.verified.outputs.ready != 'true'
        env:
          GUIDED_VERSION: ${{ steps.release.outputs.version }}
          GUIDED_BUILD: ${{ github.run_number }}
        run: bash source/guided-assistance/build.sh
      - name: Compile iPhone simulator app
        if: steps.verified.outputs.ready != 'true'
        env:
          GUIDED_VERSION: ${{ steps.release.outputs.version }}
          GUIDED_BUILD: ${{ github.run_number }}
        run: bash source/guided-assistance/build.sh simulator
      - name: Verify native app in iPhone simulator
        if: steps.verified.outputs.ready != 'true'
        run: bash source/guided-assistance/smoke.sh --skip-build
      - name: Check shared Mac app target
        if: steps.verified.outputs.ready != 'true'
        working-directory: source/guided-assistance
        run: xcodebuild -quiet -project GuidedAssistance.xcodeproj -scheme GuidedAssistance-Mac -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build/MacDerivedData -clonedSourcePackagesDirPath build/Packages ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Publish app and update existing AltStore source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ROOT=source/guided-assistance
          TAG="guided-$VERSION"
          IPA="$ROOT/build/GuidedAssistance.ipa"
          gh release create "$TAG" "$IPA" "$ROOT/build/guided-assistance-icon.png" \
            "$ROOT/build/guided-assistance-screenshot.png" "$ROOT/build/simulator-check.json" \
            --draft --title "Guided Assistance $VERSION" --notes-file "$ROOT/RELEASE.md" --target "$GITHUB_SHA"
          gh release edit "$TAG" --draft=false --latest=false
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/GuidedAssistance.ipa"
          curl --fail --location --head --retry 5 --retry-all-errors --retry-delay 3 "$URL"
          SIZE=$(stat -f%z "$IPA")
          DATE=$(gh release view "$TAG" --json publishedAt --jq .publishedAt)
          git pull --rebase origin main
          python3 scripts/update_source.py --file source/apps.json --app-template "$ROOT/release/app.json" \
            --version "$VERSION" --download-url "$URL" --size "$SIZE" --date "$DATE" --ipa "$IPA" \
            --notes-file "$ROOT/RELEASE.md" --release-title "Guided Assistance $VERSION"
          python3 - "$TAG" <<'PY'
          import json,pathlib,sys,os
          path=pathlib.Path('source/apps.json');data=json.loads(path.read_text())
          app=next(a for a in data['apps'] if a['bundleIdentifier']=='com.kharrison.guidedassistance')
          base=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{sys.argv[1]}"
          app['iconURL']=base+'/guided-assistance-icon.png'
          app['screenshots']=[base+'/guided-assistance-screenshot.png']
          path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/apps.json
          git commit -m "Publish Guided Assistance $VERSION in AltStore [skip ci]"
          git push origin HEAD:main
      - name: Save build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-assistance-${{ github.run_number }}
          path: |
            source/guided-assistance/build/GuidedAssistance.ipa
            source/guided-assistance/build/guided-assistance-icon.png
            source/guided-assistance/build/guided-assistance-screenshot.png
            source/guided-assistance/build/simulator-check.json
            source/guided-assistance/GuidedAssistance.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always() && steps.verified.outputs.ready != 'true'
        with:
          path: |
            source/guided-assistance/build/Packages
            source/guided-assistance/build/DerivedData
            source/guided-assistance/build/MacDerivedData
          key: guided-native-xcode266-${{ github.run_id }}
